[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "namaa-ai"
version = "0.1.0"
description = "Synthetic, review-gated Namaa extraction and demonstration rules"
requires-python = ">=3.11"
dependencies = ["pydantic==2.12.4", "httpx==0.28.1"]

[project.optional-dependencies]
test = ["pytest==9.0.1"]

[project.scripts]
namaa-ai = "namaa_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
namaa_ai = ["prompts/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "api_integration: exercises the real FastAPI application with an isolated database",
  "live_security: checks AuthZEN and audit over HTTP against NAMAA_AI_TEST_API_URL",
  "live_bridges: checks announced bridges against NAMAA_AI_TEST_API_URL",
  "live_rule_outcomes: checks all four outcomes using NAMAA_AI_TEST_RULE_CASES backend seed mappings",
]
